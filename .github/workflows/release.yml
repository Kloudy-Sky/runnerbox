name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --no-experimental-strip-types dist/runnerbox.js --help
      - run: cd dist && sha256sum runnerbox.js > runnerbox.js.sha256
      # Tags with a hyphen, like v0.1.0-rc.1, become prereleases.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/runnerbox.js dist/runnerbox.js.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"

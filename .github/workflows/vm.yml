name: vm

# Builds the VM from `runnerbox vm render` on a clean machine, then checks its firewall from inside.
on:
  pull_request:
    paths:
      ["src/vm/**", "image/**", "src/launcher/docker-command.ts", "src/cli.ts", "package.json", "pnpm-lock.yaml", "runnerbox.vm.example.json", ".github/workflows/vm.yml"]
  push:
    branches: [main]
    paths:
      ["src/vm/**", "image/**", "src/launcher/docker-command.ts", "src/cli.ts", "package.json", "pnpm-lock.yaml", "runnerbox.vm.example.json", ".github/workflows/vm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm build

      - name: Set up KVM and libvirt
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends \
            qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-daemon-config-network dnsmasq-base virtinst xorriso
          sudo modprobe br_netfilter && sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo virsh pool-define-as default dir --target /var/lib/libvirt/images
          sudo virsh pool-start default
          sudo virsh net-info default | grep -Eq '^Active: +yes' || sudo virsh net-start default

      - name: Render and create the VM
        run: |
          dir="$RUNNER_TEMP/vm" && mkdir -p "$dir"
          ssh-keygen -q -t ed25519 -N '' -f "$dir/key"
          # A smaller VM than the example, to fit the runner.
          jq --arg key "$dir/key.pub" '.sshPublicKeyFile = $key | .cpus = 2 | .memoryMiB = 3072 | .diskGiB = 24 | .swapGiB = 1' \
            runnerbox.vm.example.json > "$dir/vm.json"
          node --no-experimental-strip-types dist/runnerbox.js vm render --config "$dir/vm.json" --out "$dir/out"
          sudo "$dir/out/create.sh"

      - name: Check the VM from inside
        run: |
          dir="$RUNNER_TEMP/vm"
          # Something on the host to try to reach, on the gateway and on the runner's own private address.
          python3 -m http.server 8080 --bind 0.0.0.0 >/dev/null 2>&1 &
          host_ip=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
          sleep 1 && curl -fsS --max-time 5 -o /dev/null "http://$host_ip:8080"

          sudo ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/out/known_hosts" ci@192.168.122.10 \
            HOST_IP="$host_ip" bash -s <<'EOF'
          failed=0
          check() { if eval "$2" >/dev/null 2>&1; then echo "ok: $1"; else echo "FAILED: $1"; failed=1; fi; }
          blocked() { if curl -s --max-time 5 -o /dev/null "$2"; then echo "FAILED: reached $1"; failed=1; else echo "ok: $1 blocked"; fi; }

          check "kernel is 6.x ($(uname -r))" 'uname -r | grep -q "^6\."'
          check "ci can use Docker" 'docker version --format "{{.Server.Version}}"'
          check "swap is on" 'swapon --show | grep -q /swapfile'
          check "GitHub is reachable" 'curl -fsS --max-time 10 https://api.github.com'
          blocked "the gateway" http://192.168.122.1:8080
          blocked "the host's private address" "http://$HOST_IP:8080"
          blocked "link-local metadata" http://169.254.169.254/

          # Any IPv6 reply from another machine means IPv6 isn't dropped.
          iface=$(ip -o -4 route show default | awk '{print $5}')
          self=$(ip -6 -o addr show dev "$iface" scope link | awk '{print $4}' | cut -d/ -f1)
          check "IPv6 is dropped" "! ping -6 -c 3 -W 2 -I $iface ff02::1 | grep 'bytes from' | grep -vq '$self'"
          exit $failed
          EOF

      # A docker kind's job runs under sysbox with its own daemon. Its containers still sit behind
      # the VM's filter, so the gateway stays out of reach from them too.
      - name: Docker inside a job, under sysbox
        run: |
          dir="$RUNNER_TEMP/vm"
          SSH=(sudo ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/out/known_hosts" ci@192.168.122.10)
          tar -C image -c . | "${SSH[@]}" 'set -e; mkdir -p /tmp/img && tar -x -C /tmp/img
            docker build -q -t runnerbox-base /tmp/img >/dev/null && docker build -q -t runnerbox-base-docker /tmp/img/docker >/dev/null'
          "${SSH[@]}" bash -s <<'EOF'
          set -euo pipefail
          docker run --rm --runtime=sysbox-runc --entrypoint bash runnerbox-base-docker -c '
            set -euo pipefail
            sudo /usr/local/bin/start-docker.sh
            docker run --rm hello-world > /tmp/hello.txt && grep -q "Hello from Docker" /tmp/hello.txt && echo "ok: docker run inside the job"
            printf "services:\n  hi:\n    image: busybox\n    command: echo compose-ok\n" > /tmp/compose.yml
            docker compose -f /tmp/compose.yml up --abort-on-container-exit > /tmp/compose.txt 2>&1
            grep -q compose-ok /tmp/compose.txt && echo "ok: docker compose inside the job"
            docker run --rm curlimages/curl -fsS --max-time 15 -o /dev/null https://api.github.com && echo "ok: containers inside the job reach the internet"
            # Compose services publish ports on the job container and call each other back through
            # host-gateway, the inner bridge's address. That traffic stays inside the job.
            docker run -d --name svc -p 8099:80 busybox sh -c "mkdir -p /www && echo up > /www/up.txt && httpd -f -p 80 -h /www" >/dev/null
            sleep 2
            docker run --rm --add-host host.docker.internal:host-gateway curlimages/curl -fsS --max-time 10 http://host.docker.internal:8099/up.txt > /tmp/got.txt
            grep -q up /tmp/got.txt && echo "ok: a container inside the job reaches a port the job publishes, through host-gateway"
            docker rm -f svc >/dev/null
            if docker run --rm busybox wget -T 5 -q -O /dev/null http://192.168.122.1:8080; then
              echo "FAILED: a container inside the job reached the gateway"; exit 1
            fi
            echo "ok: the gateway is blocked from inside the job'"'"'s containers"'
          EOF

      # Proves the checks above can fail: with a filter that accepts everything, the same targets answer.
      - name: Control, with the filter opened up
        run: |
          dir="$RUNNER_TEMP/vm"
          # Redefining a filter in place needs its existing uuid.
          uuid=$(sudo virsh nwfilter-dumpxml runnerbox-isolated | sed -n 's|.*<uuid>\(.*\)</uuid>.*|\1|p')
          printf "<filter name='runnerbox-isolated' chain='root'><uuid>%s</uuid><rule action='accept' direction='inout' priority='500'><all/></rule></filter>\n" \
            "$uuid" > "$dir/open.xml"
          sudo virsh nwfilter-define "$dir/open.xml"
          host_ip=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") print $(i + 1)}')
          sudo ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/out/known_hosts" ci@192.168.122.10 \
            HOST_IP="$host_ip" bash -s <<'EOF'
          set -e
          curl -fsS --max-time 5 -o /dev/null http://192.168.122.1:8080
          curl -fsS --max-time 5 -o /dev/null "http://$HOST_IP:8080"
          echo "ok: the gateway and the host's private address answer without the filter"
          # Report only: whether these answer depends on the runner, so a no here means CI can't prove
          # that check, not that the filter is wrong.
          if curl -s --max-time 5 -o /dev/null http://169.254.169.254/; then
            echo "ok: link-local metadata answers without the filter"
          else echo "note: link-local metadata doesn't answer here even without the filter"; fi
          iface=$(ip -o -4 route show default | awk '{print $5}')
          self=$(ip -6 -o addr show dev "$iface" scope link | awk '{print $4}' | cut -d/ -f1)
          if ping -6 -c 3 -W 2 -I "$iface" ff02::1 | grep 'bytes from' | grep -vq "$self"; then
            echo "ok: IPv6 gets replies without the filter"
          else echo "note: IPv6 gets no replies here even without the filter"; fi
          EOF
          # And from a container the job starts, so the gateway check inside the job can fail too.
          sudo ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/out/known_hosts" ci@192.168.122.10 \
            "docker run --rm --runtime=sysbox-runc --entrypoint bash runnerbox-base-docker -c 'sudo /usr/local/bin/start-docker.sh && docker run --rm busybox wget -T 5 -q -O /dev/null http://192.168.122.1:8080' && echo 'ok: the gateway answers a container inside the job without the filter'"

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Some distro Node builds can't strip types, so prove the release file doesn't need it.
      - run: node --no-experimental-strip-types dist/runnerbox.js --help
      - run: node --no-experimental-strip-types dist/runnerbox.js serve --help
      # Template units can't be verified as templates, so each is checked as one instance.
      - name: systemd units are valid
        run: |
          dir=$(mktemp -d)
          for unit in deploy/*.service deploy/*.timer; do cp "$unit" "$dir/$(basename "$unit" | sed 's/@\./@example__repo./')"; done
          systemd-analyze verify "$dir"/*

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t runnerbox-base image
      # Proves the runner and Node it installed start on this image, as the image's own user.
      - run: docker run --rm --entrypoint ./bin/Runner.Listener runnerbox-base --version
      - run: docker run --rm --entrypoint bash runnerbox-base -c '/opt/hostedtoolcache/node/*/x64/bin/node --version'
      - run: docker build -t runnerbox-base-docker image/docker
      - run: docker run --rm --entrypoint bash runnerbox-base-docker -c 'docker --version && docker compose version'

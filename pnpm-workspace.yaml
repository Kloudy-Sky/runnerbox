# The root package is the core and the CLI. Apps and packages around it build on that core.
packages:
  - apps/*
  - infra/*
  - packages/*
# Wait three days before installing a new release, so a hijacked package has time to be caught.
minimumReleaseAge: 4320
# esbuild's install script only checks its binary, which works without it. Electron's downloads
# its binary, which only the desktop app needs, so `pnpm --filter @runnerbox/desktop ensure:electron` does that.
ignoredBuiltDependencies:
  - electron
  # Windows installer tooling pulled in by electron-builder; no Windows target is built.
  - electron-winstaller
  - esbuild
# @effect/platform-node 4.0.5 accepts any 4.x of this, and newer ones need a newer effect.
overrides:
  "@effect/platform-node-shared": 4.0.5
# The agent SDK drives the `claude` the environment already has, so its bundled CLI binaries
# aren't needed. Threads give it tools through a small MCP shim, never its zod or MCP helpers.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"
packageExtensions:
  "@anthropic-ai/claude-agent-sdk":
    peerDependenciesMeta:
      "@anthropic-ai/sdk": { optional: true }
      "@modelcontextprotocol/sdk": { optional: true }
      zod: { optional: true }
